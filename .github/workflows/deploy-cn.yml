name: Deploy docs to China (CloudFront)

# China mirror of the docs site: https://docs.routero.dcsmartvision.com
#
# Independent of the GitHub Pages deploy (deploy.yml → docs.routero.ai) — same
# source, built with the China overlay (_config.cn.yml: canonical URL + CN
# outbound links), published to the PRIVATE S3 bucket behind the China
# CloudFront distribution (OAI origin; the bucket is never publicly readable).
# Viewer cert lifecycle for that distribution is owned by
# cert-renewal-cn.yml (China CloudFront cannot use ACM).
#
# Infra (bucket / OAI / distribution / DNS / IAM role) was created once via
# CLI — this workflow only builds, syncs and invalidates.
#
# Auth: GitHub OIDC → llmrouter-production-cn-bj-docs-deploy role in the AWS
# China account (China-partition audience sts.amazonaws.com.cn — no static
# keys anywhere).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC token for the AWS role assumption

concurrency:
  group: deploy-cn
  cancel-in-progress: false

env:
  AWS_REGION: cn-north-1
  AWS_ROLE_ARN: arn:aws-cn:iam::138720667650:role/llmrouter-production-cn-bj-docs-deploy
  S3_BUCKET: llmrouter-production-cn-bj-docs
  DISTRIBUTION_ID: E5NQRPCHWTRGH

jobs:
  deploy:
    name: Build & publish (China)
    runs-on: ubuntu-latest
    environment: production-cn
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build with Jekyll (China overlay)
        run: bundle exec jekyll build --config _config.yml,_config.cn.yml
        env:
          JEKYLL_ENV: production

      - name: Configure AWS credentials (China partition)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com.cn

      # The runner uploads cross-border to s3.cn-north-1.amazonaws.com.cn and
      # bad transpacific routes regularly kill streams (SSL EOF, PutObject
      # RequestTimeout, throughput down to KiB/s). Two mitigations:
      #   - adaptive retry mode with a raised attempt budget, so single
      #     dropped PUTs recover inside the CLI instead of failing the job;
      #   - fewer concurrent streams, which is gentler on a lossy link.
      - name: Tune S3 transfer settings for a lossy cross-border link
        run: |
          aws configure set default.retry_mode adaptive
          aws configure set default.max_attempts 8
          aws configure set default.s3.max_concurrent_requests 4

      # Retry helper: re-run a command up to 5 times with linear backoff.
      # Every S3 write below is idempotent, so a retry only sends what a
      # failed attempt left behind (put-object overwrites the same key; sync
      # skips keys already uploaded).
      #
      # Two complementary sync passes so each content type gets its own
      # Cache-Control (s3 sync applies one metadata value per pass):
      #   pass 1 — assets (css/js/images/fonts): browser-cached 1 day
      #   pass 2 — HTML + search-data JSON: always revalidate
      # The --delete filters are complementary too, so files removed from the
      # repo are pruned from the bucket exactly once across the two passes.
      # CNAME is a GitHub Pages routing hint — never publish it to S3.
      #
      # --size-only on the assets pass: every CI run rebuilds _site from
      # scratch, so ALL local mtimes are newer than the bucket's objects and
      # sync's default mtime rule would re-upload the full ~15 MiB of assets
      # on every deploy. Size-only makes each run (and every retry of a failed
      # run) an incremental delta — decisive when the cross-border route is
      # degraded to KiB/s. Safe here: binary assets change size whenever their
      # content changes. The HTML pass keeps the default comparison so an edit
      # that leaves a page byte-count-identical is still picked up.
      - name: Sync _site to S3
        run: |
          set -euo pipefail
          retry() {
            desc="$1"; shift
            for attempt in 1 2 3 4 5; do
              echo "::group::${desc} (attempt ${attempt})"
              if aws "$@"; then
                echo "::endgroup::"
                echo "${desc}: succeeded on attempt ${attempt}"
                return 0
              fi
              echo "::endgroup::"
              echo "${desc}: attempt ${attempt} failed" >&2
              [ "${attempt}" -eq 5 ] && break
              sleep $((attempt * 30))
            done
            echo "${desc}: giving up after 5 attempts" >&2
            return 1
          }
          retry "assets pass" s3 sync _site/ "s3://${S3_BUCKET}/" --delete --size-only \
            --exclude "CNAME" --exclude "*.html" --exclude "*.json" \
            --cache-control "public, max-age=86400"
          retry "html pass" s3 sync _site/ "s3/${S3_BUCKET}/" --delete \
            --exclude "*" --include "*.html" --include "*.json" \
            --cache-control "no-cache, must-revalidate"

      # Directory-index aliases. S3 (unlike GitHub Pages) serves no directory
      # indexes and CloudFront's DefaultRootObject only covers "/", while the
      # site links to the Chinese home as BOTH /zh-CN and /zh-CN/. China
      # CloudFront has no Functions to rewrite URIs either — so publish the zh
      # index under those two exact keys as well. Must run AFTER the sync passes
      # (sync's --delete would otherwise remove them as non-local keys).
      - name: Publish directory-index aliases (zh-CN)
        run: |
          set -euo pipefail
          retry() {
            for attempt in 1 2 3 4 5; do
              if "$@" > /dev/null; then return 0; fi
              [ "${attempt}" -eq 5 ] && return 1
              sleep $((attempt * 10))
            done
          }
          for KEY in "zh-CN" "zh-CN/"; do
            retry aws s3api put-object \
              --bucket "${S3_BUCKET}" --key "${KEY}" \
              --body _site/zh-CN/index.html \
              --content-type "text/html" \
              --cache-control "no-cache, must-revalidate" \
              || { echo "alias key '${KEY}' failed after retries" >&2; exit 1; }
          done
          echo "published /zh-CN and /zh-CN/ alias keys"

      # Fire-and-forget: China edge invalidations of "/*" typically complete in
      # a few minutes; waiting here would add minutes to every docs deploy.
      - name: Invalidate CloudFront edge cache
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if aws cloudfront create-invalidation \
              --distribution-id "${DISTRIBUTION_ID}" \
              --paths "/*" \
              --query "Invalidation.Status" --output text; then
              exit 0
            fi
            [ "${attempt}" -eq 5 ] && { echo "invalidation failed after retries" >&2; exit 1; }
            sleep $((attempt * 10))
          done
